<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biology Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        } 
        .quiz-creator-container {
            width: 800px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .formatting-toolbar {
            display: flex;
            gap: 8px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .formatting-toolbar button {
            background: none;
            border: none;
            padding: 5px 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .formatting-toolbar button:hover {
            background-color: #f0f0f0;
        }
        .question-editor {
            background-color: #4a148c;
            padding: 20px;
            border-radius: 0 0 10px 10px;
        }
        .question-input {
            width: 100%;
            min-height: 100px;
            background-color: transparent;
            border: none;
            color: white;
            font-size: 18px;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            resize: none;
        }
        .answer-options {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
        }
        .answer {
            flex: 1;
            position: relative;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            min-height: 120px;
            transition: transform 0.3s;
            cursor: pointer;
        }
        .answer:hover {
            transform: scale(1.05);
        }
        .answer input {
            width: 100%;
            background: transparent;
            border: none;
            text-align: center;
            color: white;
            font-size: 16px;
            outline: none;
            pointer-events: none;
        }
        .answer.selected {
            border: 3px solid white;
        }
        .answer.blue { background-color: #2563eb; }
        .answer.teal { background-color: #14b8a6; }
        .answer.yellow { background-color: #eab308; color: black; }
        .answer.red { background-color: #dc2626; }
        .quiz-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .submit-quiz-btn {
            background-color: purple;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-quiz-btn:hover {
            background-color: #6a0dad;
        }
        #result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 2000;
            display: none;
        }
        .navigation-arrows {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .navigation-arrow {
            background-color: rgba(255,255,255,0.2);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            pointer-events: auto;
            transition: background-color 0.3s;
        }
        .navigation-arrow:hover {
            background-color: rgba(255,255,255,0.4);
        }
        .navigation-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .question-counter {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #4a148c;
            font-weight: bold;
        }
        #close-modal {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4a148c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #close-modal:hover {
            background-color: #6a0dad;
        }
    </style>
</head>
<body>
   
        <div class="question-editor">
            <div id="question-input" class="question-input"></div>
            <div id="answer-options" class="answer-options"></div>
            <div class="quiz-controls">
                <div class="navigation-arrows">
                    <button id="prev-btn" class="navigation-arrow">←</button>
                    <button id="next-btn" class="navigation-arrow">→</button>
                </div>
                <button id="submit-quiz-btn" class="submit-quiz-btn">Submit Quiz</button>
            </div>
            <div id="question-counter" class="question-counter">1/5</div>
        </div>
    </div>

    <div id="result-modal">
        <div class="modal-content">
            <h2 id="result-title">Quiz Result</h2>
            <p id="result-message"></p>
            <p id="score-display"></p>
            <button id="close-modal">Close</button>
        </div>
    </div>

    <div id="notification" class="notification">
        Quiz submitted successfully!
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const questionInput = document.getElementById('question-input');
            const answerOptions = document.getElementById('answer-options');
            const submitQuizBtn = document.getElementById('submit-quiz-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const questionCounter = document.getElementById('question-counter');
            const resultModal = document.getElementById('result-modal');
            const closeModalBtn = document.getElementById('close-modal');
            const notification = document.getElementById('notification');
            const resultMessage = document.getElementById('result-message');
            const scoreDisplay = document.getElementById('score-display');

            // Quiz questions and answers
            const quizData = [
                {
                    question: "Which of the following is NOT a function of the mitochondria in a cell?",
                    answers: [
                        { text: "Protein synthesis", correct: true, color: "blue" },
                        { text: "Energy production", correct: false, color: "teal" },
                        { text: "Cellular respiration", correct: false, color: "yellow" },
                        { text: "ATP generation", correct: false, color: "red" }
                    ]
                },
                {
                    question: "What is the primary function of ribosomes in a cell?",
                    answers: [
                        { text: "Lipid synthesis", correct: false, color: "blue" },
                        { text: "Protein synthesis", correct: true, color: "teal" },
                        { text: "Cell division", correct: false, color: "yellow" },
                        { text: "Energy production", correct: false, color: "red" }
                    ]
                },
                {
                    question: "Which organelle is responsible for processing and packaging proteins?",
                    answers: [
                        { text: "Nucleus", correct: false, color: "blue" },
                        { text: "Lysosome", correct: false, color: "teal" },
                        { text: "Golgi apparatus", correct: true, color: "yellow" },
                        { text: "Endoplasmic reticulum", correct: false, color: "red" }
                    ]
                },
                {
                    question: "What is the primary role of chloroplasts?",
                    answers: [
                        { text: "Cellular respiration", correct: false, color: "blue" },
                        { text: "Protein folding", correct: false, color: "teal" },
                        { text: "Photosynthesis", correct: true, color: "yellow" },
                        { text: "Waste disposal", correct: false, color: "red" }
                    ]
                },
                {
                    question: "Which cellular structure provides support and protection in plant cells?",
                    answers: [
                        { text: "Cell membrane", correct: false, color: "blue" },
                        { text: "Cytoplasm", correct: false, color: "teal" },
                        { text: "Nucleus", correct: false, color: "yellow" },
                        { text: "Cell wall", correct: true, color: "red" }
                    ]
                }
            ];

            let currentQuestionIndex = 0;
            const userAnswers = new Array(quizData.length).fill(null);

            // Render question and answers
            function renderQuestion(index) {
                const question = quizData[index];
                
                // Update question text
                questionInput.textContent = question.question;

                // Clear previous answers
                answerOptions.innerHTML = '';

                // Render new answers
                question.answers.forEach(answer => {
                    const answerElement = document.createElement('div');
                    answerElement.classList.add('answer', answer.color);
                    answerElement.innerHTML = `<input type="text" value="${answer.text}" readonly>`;
                    
                    // Check if this answer was previously selected
                    if (userAnswers[index] === answer.text) {
                        answerElement.classList.add('selected');
                    }

                    answerElement.addEventListener('click', () => {
                        // Deselect all answers
                        answerOptions.querySelectorAll('.answer').forEach(a => {
                            a.classList.remove('selected');
                        });

                        // Select clicked answer
                        answerElement.classList.add('selected');
                        userAnswers[index] = answer.text;
                    });

                    answerOptions.appendChild(answerElement);
                });

                // Update navigation buttons
                prevBtn.disabled = index === 0;
                nextBtn.disabled = index === quizData.length - 1;

                // Update question counter
                questionCounter.textContent = `${index + 1}/${quizData.length}`;
            }

            // Initial render
            renderQuestion(currentQuestionIndex);

            // Navigation buttons
            prevBtn.addEventListener('click', () => {
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    renderQuestion(currentQuestionIndex);
                }
            });

            nextBtn.addEventListener('click', () => {
                if (currentQuestionIndex < quizData.length - 1) {
                    currentQuestionIndex++;
                    renderQuestion(currentQuestionIndex);
                }
            });

            // Submit quiz
            submitQuizBtn.addEventListener('click', () => {
                // Check if all questions are answered
                if (userAnswers.includes(null)) {
                    alert('Please answer all questions before submitting.');
                    return;
                }

                // Show notification
                notification.style.display = 'block';
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 3000);

                // Calculate score
                let score = 0;
                quizData.forEach((question, index) => {
                    const correctAnswer = question.answers.find(a => a.correct).text;
                    if (userAnswers[index] === correctAnswer) {
                        score++;
                    }
                });

                // Prepare result modal
                resultMessage.textContent = `You scored ${score} out of ${quizData.length} questions correct!`;
                resultMessage.style.color = score === quizData.length ? "#4CAF50" : 
                                            score >= quizData.length / 2 ? "#FFA500" : "#f44336";
                scoreDisplay.textContent = `Score: ${score}/${quizData.length}`;

                // Show result modal
                resultModal.style.display = 'flex';
            });

            // Close modal and redirect to explore.php
            closeModalBtn.addEventListener('click', () => {
                window.location.href = '../php/explore.php';
            });
        });
    </script>
</body>
</html>
